# Visual Vocabulary & Art Direction Knowledge Base
# Encodes aesthetic principles, emotional mapping, physical metaphors, and anti-patterns.

scale:
  visual_language:
    - aerial drone landscape
    - wide panoramic vista
    - dense repetitive infrastructure
    - macro to micro rack zoom
    - towering architectural verticality
  visual_metaphors:
    - endless shipping container ports
    - vast hydroelectric dams
    - mega-city transit networks
    - mountain ranges and tectonic geological strata
  emotional_tone:
    - awe
    - technological sublimity
    - overwhelming power
  cinematic_cues:
    camera: "Ultra-wide 16mm or anamorphic establishing shot"
    motion: "Slow, majestic continuous forward tracking"
    lighting: "Epic golden hour horizon or dark monolithic shadows with rim light"
    composition: "Deep depth of field, tiny human silhouette against vast structure"
  avoid:
    - generic_globe_animation: "Communicates cheap corporate PowerPoint, not authentic scale"
    - cartoonish_3d_arrows: "Detracts from physical reality"

urgency:
  visual_language:
    - rapid time-lapse
    - kinetic whip pans
    - fast pedestrian flow
    - flashing telemetry and warning strobes
    - tight shallow-depth tracking
  visual_metaphors:
    - arterial highway traffic at dusk
    - pressurized steam release valves
    - high-frequency stock exchange ticker cascade
    - emergency response dispatch floor
  emotional_tone:
    - visceral tension
    - competitive anxiety
    - rapid acceleration
  cinematic_cues:
    camera: "Handheld kinetic rig or high-shutter 45-degree angle"
    motion: "Fast push-in, sudden lateral snap cuts"
    lighting: "Harsh strobing contrast, neon reds and amber warnings"
    composition: "Tight framing, off-center framing, Dutch tilt accent"
  avoid:
    - ticking_clock_graphic: "Cliché and visually patronizing"
    - generic_stock_running_person: "Lacks narrative specificity"

growth:
  visual_language:
    - structural steel assembly
    - rising skyscraper frameworks
    - multiplying server clusters
    - botanical time-lapse cellular division
    - expanding logistics hubs
  visual_metaphors:
    - construction cranes swinging against sunrise
    - branching neural or vascular tree networks
    - silicon crystal ingot extraction
    - pouring glowing molten alloy into foundation molds
  emotional_tone:
    - dynamic momentum
    - industrial expansion
    - structural inevitability
  cinematic_cues:
    camera: "Low-angle upward tilt looking past rising vertical columns"
    motion: "Slow upward pedestal crane movement"
    lighting: "Dawn warm sunlight cutting through morning industrial mist"
    composition: "Strong leading diagonal lines pointing upward"
  avoid:
    - green_sprouting_plant_in_money: "Low-brow metaphorical slop"
    - generic_bar_chart_overlays: "Editorial dead weight"

power:
  visual_language:
    - monumental brutalist architecture
    - massive industrial machinery
    - high-voltage electrical substations
    - heavy hydraulic presses
    - server monoliths with pulsating status buses
  visual_metaphors:
    - roaring blast furnaces
    - jet engine turbine test benches
    - deep bedrock underground bunkers
    - orbital launchpad gantry towers
  emotional_tone:
    - gravity
    - sovereign control
    - unstoppable inertia
  cinematic_cues:
    camera: "Low-angle eye-level locked-off or slow motorized push"
    motion: "Deliberate, heavy, immovable camera presence"
    lighting: "High-contrast chiaroscuro, cold cobalt blue and tungsten highlights"
    composition: "Strict central symmetry, monolithic massing"
  avoid:
    - chess_pieces_falling: "Tired executive metaphor"
    - lion_roaring: "Unrelated wildlife cliché"

uncertainty:
  visual_language:
    - fog-shrouded industrial landscapes
    - silhouette reflections in rain-slicked glass
    - fragmented optical distortions
    - shadowed cleanrooms through security grilles
    - oscilloscope static and signal noise
  visual_metaphors:
    - maze of subterranean fiber optic conduits
    - chess board obscured by smoke
    - compass needle spinning erratically
    - deep ocean trench research sub headlights
  emotional_tone:
    - epistemic tension
    - existential ambiguity
    - calculated foreboding
  cinematic_cues:
    camera: "Obscured through dirty glass or doorway frame"
    motion: "Unsettled micro-jitter or slow lateral drift"
    lighting: "Low-key underexposed gloom with single piercing point source"
    composition: "Negative space dominating 70% of the frame"
  avoid:
    - question_mark_animations: "Amateur visual shortcut"
    - head_in_hands_frustration: "Overacted stock melodrama"

precision:
  visual_language:
    - semiconductor lithography extreme macro
    - surgical robotic arm articulating with sub-millimeter accuracy
    - laser interferometer calibration
    - watchmaker tweezers placing escapement gear
    - cleanroom laminar airflow indicators
  visual_metaphors:
    - laser beam splitting through optical prism
    - microchip wire bonding micro-weld
    - perfectly synchronized robotic pick-and-place assembly
    - diamond cutting facet reflection
  emotional_tone:
    - intellectual clarity
    - technological mastery
    - extreme discipline
  cinematic_cues:
    camera: "Macro probe lens tracking millimeters from moving subject"
    motion: "Zero-vibration robotic slide"
    lighting: "Clinical high-CRI white light with crisp metallic reflections"
    composition: "Mathematical grid alignment, razor-sharp focus plane"
  avoid:
    - generic_blue_binary_code_matrix: "Dated 1990s hacker trope"
    - generic_spinning_gear_graphic: "Visual cliché for productivity"

automation:
  visual_language:
    - dark factory floor operating without human lighting
    - bipedal robot executing autonomous navigation
    - automated guided vehicles (AGV) navigating warehouse floor
    - robotic pick-and-place arms moving at superhuman velocity
  visual_metaphors:
    - giant sorting facility operating in total darkness
    - automated container ship docking via sensor arrays
    - drone swarm forming geometric formations
  emotional_tone:
    - alien efficiency
    - silent transformation
    - post-human operational capacity
  cinematic_cues:
    camera: "Eye-level following robotic movement or static master surveillance"
    motion: "Smooth mechanized tracking"
    lighting: "Darkroom illuminated solely by sensor lasers and LED status arrays"
    composition: "Absence of human figures, stark geometry"
  avoid:
    - human_and_robot_touching_fingers_michelangelo: "Unforgivable visual slop"
    - cheesy_smiling_cyborg: "B-movie caricature"

wealth_capital:
  visual_language:
    - monolithic modern marble architecture
    - executive corner office overlooking morning city skyline
    - tactile handling of archival asset deeds and heavy fountain pens
    - private vault security mechanisms and heavy steel doors
    - minimalist high-end residential interiors with natural stone and timber
  visual_metaphors:
    - deep bedrock foundation supporting towering glass structure
    - quiet mountain reservoir holding immense water reserves
    - timeless mechanical watch escapement beating in stillness
    - ancient olive tree groves with deep winding root systems
  emotional_tone:
    - sovereign control
    - quiet luxury
    - generational patience
    - dignified restraint
  cinematic_cues:
    camera: "Medium slow push-in with 50mm or 85mm prime lens"
    motion: "Unrushed, locked-off slider or deliberate slow dolly"
    lighting: "Warm architectural raking sunlight cutting across textured stone and dark walnut"
    composition: "Restrained symmetry, generous negative space, extreme textural detail"
  avoid:
    - guy_in_suit_throwing_cash: "Tacky get-rich-quick 'guru' aesthetic"
    - flashy_supercars_revving: "Juvenile flex culture; destroys institutional seriousness"
    - shiny_gold_coins_stacks: "PowerPoint clip-art cliché"

financial_asymmetry:
  visual_language:
    - Bloomberg trading terminals in dim blue ambient light
    - fast electronic financial ticker tape reflecting in executive glasses
    - macro close-up of ink drying on official contract signature
    - empty corporate boardroom at sunrise before major announcement
    - currency printing press or vault bullion inspection
  visual_metaphors:
    - massive chess board where single move triggers chain reaction
    - steel suspension bridge bearing immense calculated load
    - balance scale tipping decisively with single drop of water
    - shipping fleet navigating through turbulent coastal narrows
  emotional_tone:
    - calculated risk
    - intellectual dominance
    - high-stakes gravity
  cinematic_cues:
    camera: "Tight 100mm macro rack-focus or low-angle slow tilt"
    motion: "Precise linear motorized tracking"
    lighting: "Cool corporate cobalt paired with single warm tungsten lamp"
    composition: "Dynamic diagonals, sharp contrast edges"
  avoid:
    - green_and_red_crypto_candles_neon: "Gambling hype; ruins financial authority"
    - wall_street_bull_statue_generic: "Overused tourist stock footage"

mental_focus:
  visual_language:
    - solitary individual writing in leather journal at dawn
    - clock hands ticking in silent minimalist room
    - person reading dense book in wood-paneled library with natural window light
    - athlete or craftsman eyes narrowing in intense concentration
    - deep breath before entering cold plunge or focused sprint
  visual_metaphors:
    - single beam of sunlight piercing dark cavern
    - calm mountain lake mirror-like surface without ripples
    - samurai sword blade reflecting razor-sharp light edge
    - archer drawing bowstring in total acoustic silence
  emotional_tone:
    - deep focus
    - monastic discipline
    - cognitive stillness
    - unwavering resolve
  cinematic_cues:
    camera: "Intimate close-up on hands, eyes, or pen tip (macro probe lens)"
    motion: "Locked-off tripod or imperceptible slow push"
    lighting: "Natural directional daylight from single large north-facing window"
    composition: "Extreme shallow depth of field, subject isolated against soft bokeh"
  avoid:
    - generic_student_studying_with_laptop: "Low-production YouTube vlog look"
    - lightbulb_turning_on_over_head: "Comic-book visual slop"

mental_burnout:
  visual_language:
    - fragmented reflections in rain-streaked night skyscraper windows
    - harsh flickering fluorescent lights in empty late-night office
    - blurred pedestrian crowd passing rapidly while subject stands frozen
    - restless insomnia silhouette gazing out over neon city at 3 AM
    - screen glare washing over exhausted face in pitch darkness
  visual_metaphors:
    - overheated steam engine with trembling pressure needle
    - fraying rope holding heavy suspended weight
    - glass vase showing fine spiderweb fractures before shattering
    - dry cracked desert earth under merciless noon sun
  emotional_tone:
    - cognitive exhaustion
    - sensory overload
    - claustrophobic friction
    - vulnerability
  cinematic_cues:
    camera: "Medium close-up with subtle organic breathing handheld motion"
    motion: "Disorienting rack-focus or slow dizzying rotation"
    lighting: "Sickly fluorescent green-tinted white or harsh blue monitor wash"
    composition: "Cramped framing, subject trapped by heavy architectural edges"
  avoid:
    - head_in_hands_sobbing_actor: "Melodramatic amateur stock acting"
    - cartoon_battery_empty_icon: "Patronizing visual shortcut"

stoic_clarity:
  visual_language:
    - monolithic granite cliffs standing immovable against crashing ocean waves
    - solitary figure standing calmly in heavy rain or mountain storm
    - classical marble bust in quiet museum hall with shadow interplay
    - footsteps echoing through ancient brutalist concrete corridor
    - clear mountain spring water flowing over smooth dark river stones
  visual_metaphors:
    - lighthouse standing resolute amidst violent ocean gale
    - massive oak tree bending in wind without breaking
    - anvil remaining unblemished beneath falling hammer blows
  emotional_tone:
    - transcendent composure
    - emotional equilibrium
    - unshakeable endurance
    - ancient wisdom
  cinematic_cues:
    camera: "Wide or medium static symmetrical tableau"
    motion: "Static locked tripod (zero motion, let environment move around stillness)"
    lighting: "Overcast soft diffused daylight, cool slate-grey and deep forest tones"
    composition: "Strict central anchor, strong horizontal ground plane"
  avoid:
    - cheesy_zen_stones_stacked: "Spa brochure cliché"
    - fake_buddha_statue_with_incense: "Superficial aesthetic trope"

